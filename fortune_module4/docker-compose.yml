services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fortune_module4
      POSTGRES_USER: fortune
      POSTGRES_PASSWORD: fortune
    ports:
      - "5432:5432"
    volumes:
      - module4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortune -d fortune_module4"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_NAME: fortune-module4
      ENVIRONMENT: docker
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://fortune:fortune@db:5432/fortune_module4
      AUTO_CREATE_TABLES: "false"
      EMBEDDING_PROVIDER: hash
      LLM_PROVIDER: template
    ports:
      # The web app reaches Module 4 at 8003 by default and the Python
      # algorithm service already owns 8000 on a single-machine deployment.
      # Override the host side with MODULE4_HOST_PORT when 8003 is taken.
      - "${MODULE4_HOST_PORT:-8003}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  module4_pgdata:
