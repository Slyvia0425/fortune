[pytest]
# Put python_algorithm/ on sys.path so `from app import app`,
# `from hexagram_engine import ...` and `from bazi...` all resolve.
# pytest's default norecursedirs already skips .venv and __pycache__.
pythonpath = .
markers =
    slow: takes several seconds (cross-validation against lunar-python, large sweeps); skipped by default, run all with: pytest -m ""
addopts = -m "not slow"
